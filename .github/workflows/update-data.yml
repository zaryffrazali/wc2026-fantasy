name: Update Player Data

# Rebuilds public/data/players.json from the FIFA Fantasy feeds via build_pool.cjs.
on:
  schedule:
    - cron: "30 5 * * *"   # daily 05:30 UTC
  workflow_dispatch:

jobs:
  refresh-players:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Rebuild player pool
        run: node r-analytics/build_pool.cjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet public/data/players.json; then
            git add public/data/players.json
            git commit -m "data: refresh player pool"
            git push
          else
            echo "No player-pool changes."
          fi
