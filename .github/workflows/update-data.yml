name: Update Player Data

# Rebuilds public/data/players.json from the FIFA Fantasy feeds via build_pool.cjs.
permissions:
  contents: write

on:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours
  workflow_dispatch:

jobs:
  refresh-players:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Rebuild player pool
        run: node r-analytics/build_pool.cjs
      - name: Fetch news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run fetch-news
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/players.json public/data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh player pool + news"
            git push
          else
            echo "No player/news changes."
          fi
