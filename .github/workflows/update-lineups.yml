name: Update Predicted Lineups

# Add ANTHROPIC_API_KEY in repo Settings → Secrets and variables → Actions → New repository secret
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

jobs:
  fetch-lineups:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch lineups
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run fetch-lineups
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet public/data/lineups.json; then
            git add public/data/lineups.json
            git commit -m "data: refresh predicted lineups"
            git push
          else
            echo "No lineup changes."
          fi
