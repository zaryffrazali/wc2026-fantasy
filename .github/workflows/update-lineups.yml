name: Update Predicted Lineups

# Add ANTHROPIC_API_KEY in repo Settings → Secrets and variables → Actions → New repository secret
permissions:
  contents: write

on:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours
  workflow_dispatch:

jobs:
  fetch-lineups:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch lineups
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run fetch-lineups
      - name: Fetch news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run fetch-news
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/lineups.json public/data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh predicted lineups + news"
            git push
          else
            echo "No lineup/news changes."
          fi
