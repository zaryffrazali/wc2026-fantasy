name: Update News

# Fetches WC2026 fantasy news via news_fetch.cjs (Claude + web search, server-side).
# Runs every 6h but ONLY actually fetches during the tournament window (Jun 11 – Jul 19);
# outside that window the fetch step is skipped (cost control — news is low-value off-tournament).
permissions:
  contents: write

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check if matchday period
        id: check_date
        run: |
          TODAY=$(date +%Y-%m-%d)
          if [[ "$TODAY" > "2026-06-10" && "$TODAY" < "2026-07-20" ]]; then
            echo "is_tournament=true" >> $GITHUB_OUTPUT
          else
            echo "is_tournament=false" >> $GITHUB_OUTPUT
          fi
      - name: Fetch news
        if: steps.check_date.outputs.is_tournament == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run fetch-news
      - name: Commit if changed
        if: steps.check_date.outputs.is_tournament == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh news"
            git push
          else
            echo "No news changes."
          fi
